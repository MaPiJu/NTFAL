# Elder Triple Screen Scanner — configuration
# Nothing in this file is a secret; secrets (if ever needed) belong in .env.

[scanner]
# The watched markets. Entries may be:
#   - explicit perps, e.g. "BTC", "ETH", or tradfi perps like "xyz:GOLD"
#   - "*"      = EVERY tradable native (crypto) Hyperliquid perp
#   - "xyz:*"  = every tradable perp of the HIP-3 "xyz" dex — the tradfi
#                universe (stocks, indices, gold, oil, forex…)
# Scanning a whole universe means one card per perp and a refresh measured in
# minutes; a short explicit list is the intended way to use this tool.
#
# The default six are the tradfi markets this operator trades, mapped from
# their common names to the Hyperliquid "xyz" dex (verified against live marks):
#   XAU   gold   -> xyz:GOLD        US500  S&P 500     -> xyz:SP500
#   XAG   silver -> xyz:SILVER      US100  Nasdaq-100  -> xyz:XYZ100
#   USOIL WTI    -> xyz:CL          UKOIL  Brent       -> xyz:BRENTOIL
watchlist = ["xyz:GOLD", "xyz:SILVER", "xyz:CL", "xyz:BRENTOIL", "xyz:SP500", "xyz:XYZ100"]

# Which horizon's bars drive Elder trade management for OPEN positions. A held
# position is strategic, so it is judged on the longest chain by default.
positions_horizon = "swing"

# --- Timeframe chains ------------------------------------------------------
# Each horizon is one full Triple Screen, with the three screens named by role:
#   tide  = 1st screen, strategic bias     wave = 2nd screen, counter-trend entry
#   entry = 3rd screen, lower-timeframe entry timing
# Elder's "factor of ~5" holds inside each chain. `refresh_seconds` sets how
# often the horizon is recomputed (a weekly tide doesn't move every 5 minutes).
# `min_tide_bars`: below this much tide history the EMA26 is not converged, so
# the tide and its Impulse are flagged unreliable rather than silently trusted.

[[scanner.horizons]]
name = "swing"
label = "Swing (days → weeks)"
tide = "1w"
wave = "1d"
entry = "4h"
lookback_tide = 260
lookback_wave = 500
lookback_entry = 1000
refresh_seconds = 86400   # once a day
min_tide_bars = 60

[[scanner.horizons]]
name = "scalp"
label = "Scalp (hours)"
tide = "4h"
wave = "1h"
entry = "15m"
lookback_tide = 1000
lookback_wave = 2000
lookback_entry = 2000
refresh_seconds = 3600    # hourly
min_tide_bars = 60

[[scanner.horizons]]
name = "micro"
label = "Minutes"
tide = "1h"
wave = "15m"
entry = "5m"
lookback_tide = 2000
lookback_wave = 2000
lookback_entry = 2000
refresh_seconds = 300     # every 5 minutes
min_tide_bars = 60

[strategy]
# Strategy thresholds/weights. Defaults mirror the Elder scanner's built-in
# behavior; tune here instead of editing code. Every lookback is a count of
# BARS on the relevant screen's timeframe, so the same numbers carry across
# horizons. Any key here may be overridden per horizon with a
# [scanner.horizons.strategy] sub-block.
flat_trend_slope_pct = 0.001
# "last ~4-6 weeks" of wave bars, used for the average EMA penetration.
penetration_lookback_bars = 35
# Elder's 2nd-screen caveat (p.158): skip the wave Force Index buy/short signal
# when FI(2) prints a NEW multi-period low (longs) / high (shorts) — the move is
# accelerating, not a pullback. ~3-4 weeks of wave bars.
force_index_extreme_lookback_bars = 25
channel_lookback_bars = 26
# Elder fits the channel (around the slow EMA26) so it contains ~95% of the last
# `channel_lookback_bars` tide bars (p.167); used as the fallback profit target.
channel_containment = 0.95
min_reward_risk = 2.0
divergence_lookback = 60
# Elder/Lovvorn (p.88): only flag a divergence when its two extremes are this
# many bars apart (most tradable at 20-40; the closer to 20 the better).
divergence_min_separation = 20
divergence_max_separation = 40
rr_excellent = 3.0
strong_tide_slope = 0.03
fi_scale_lookback = 20
# Require the latest completed wave close to be in/near the wave EMA13-EMA26
# value zone before a new entry is actionable. 0.03 = max 3% beyond the zone.
value_zone_max_distance_pct = 0.03
# Elder SafeZone-style stops: average adverse noise over the lookback of wave
# bars, multiplied by the factor, behind the recent wave extreme. Shorts use a
# wider factor than longs (Elder p.220: >=3 vs >=2 — shorting near highs is noisier).
safezone_lookback_bars = 20
safezone_factor_long = 2.0
safezone_factor_short = 3.0
# The theoretical stop-entry is valid only for this many completed wave bars;
# if still unfilled it should be rolled to the latest high/low while conditions hold.
entry_order_expire_bars = 2
score_reward_risk_weight = 0.40
score_impulse_weight = 0.25
score_tide_weight = 0.20
score_pullback_weight = 0.15
# Flag a horizon's signal when the recent wave bars carry far less volume than
# usual — a tradfi perp over the weekend is a near-frozen oracle, not a market.
# 0.25 = warn when the last few bars average under 25% of the recent median.
low_volume_ratio = 0.25
low_volume_bars = 6
# "Normal" volume = median of this many wave bars. Must span well over a week of
# wave bars (1000 x 15m ~ 10 days) so a ~49h weekend can't become the baseline.
low_volume_baseline_bars = 1000

[risk]
# Account equity in USD (used by the 2% Iron Triangle sizing).
equity = 10000.0
# Risk per trade as a fraction of equity. Default 1%, HARD CAP 2% — values
# above 0.02 are clamped, never silently exceeded.
#
# NOTE: each horizon sizes its suggestion as a standalone trade risking
# `risk_pct`. The same asset may show a swing long AND a micro short; taking
# several at once multiplies your risk. The 6% rule below caps total OPEN risk,
# not the number of simultaneous suggestions.
risk_pct = 0.01
# 6% Rule bookkeeping:
#   equity_at_month_start: equity on the 1st of the current month
#   month_realized_losses: realized losses so far this month (positive number)
#   open_trade_risk:       optional manual extra risk for trades not visible from
#                          the configured Hyperliquid address. Visible positions
#                          are now risked automatically from the Elder stop.
equity_at_month_start = 10000.0
month_realized_losses = 0.0
open_trade_risk = 0.0

[positions]
# Public wallet address (0x…) used to READ your open Hyperliquid positions via
# the public `clearinghouseState` info endpoint, so the tool can apply Elder's
# exit analysis (hold / take profits / exit) to trades you already hold.
# This is READ-ONLY: a public address only, never a private key — nothing is
# signed and no order is ever placed. Leave empty to disable trade management.
# May also be set via the HL_ADDRESS environment variable (see .env.example).
address = ""

# Positions declared by hand — for a trade the address above cannot see.
# One block per position:
# [[positions.manual]]
# asset = "xyz:GOLD"   # watchlist naming
# side = "long"        # or "short"
# size = 1.5           # asset units, always positive
# entry = 4300.0       # average entry price

[journal]
# Append one compact JSONL entry per refresh: top pick per horizon, actionable
# signals, open-position verdicts, stops, risks and reasons.
enabled = true
path = "cache/trading_journal.jsonl"

[cache]
dir = "cache"
