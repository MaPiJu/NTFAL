[project]
name = "ntfal"
version = "0.1.0"
description = "Elder Triple Screen scanner for Hyperliquid perps — multi-horizon analysis, with an opt-in execution bot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    # IANA time zones for the session calendar where the OS has none (Windows).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Only bot.py in testnet/mainnet mode needs these (order signing with an API wallet);
# the scanner, the dashboard and the dry run do not.
bot = [
    "hyperliquid-python-sdk>=0.24,<0.25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "black>=24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
